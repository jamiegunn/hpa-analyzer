replicaCount: 2

image:
  repository: registry.internal/payments
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 512m
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 95
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: 100m
    memory: 512m
