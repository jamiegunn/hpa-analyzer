apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umbrella-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umbrella-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
