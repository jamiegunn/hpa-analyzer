apiVersion: apps/v1
kind: Deployment
metadata:
  name: umbrella-api
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: app
          image: corp/api:1.0
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 1, memory: 1Gi}
          readinessProbe: {httpGet: {path: /r, port: 8080}}
          livenessProbe: {httpGet: {path: /l, port: 8080}}
