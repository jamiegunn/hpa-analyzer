apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "orders.fullname" . }}-test-connection"
  labels:
    {{- include "orders.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args: ['-qO-', '{{ include "orders.fullname" . }}:{{ .Values.service.port }}/actuator/health']
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 32Mi
