apiVersion: v2
name: legacy-ingress
description: >-
  A chart pinned to an OLD cluster range on purpose. It exists to prove that
  severity for a removed apiVersion depends on the range the chart declares:
  everything here is removed in 1.22, and this chart says it only supports
  1.20-1.21, so none of it can fail at apply time while that constraint stands.
  The autoscaling/v2 HPA is the opposite error - too NEW for the same range.
type: application
version: 2.1.0
appVersion: "1.9.4"
kubeVersion: ">=1.20.0-0 <1.22.0-0"
maintainers:
  - name: platform
    email: platform@example.com
